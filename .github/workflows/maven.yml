name: Java CI SQL DML Procedures

on:
  push:
    branches: [ "master" ]

jobs:
  build:

    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: hello
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - uses: actions/checkout@v3
    - name: Run test.sql
      env:
        PGPASSWORD: hello
      run: psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -f src/main/resources/test.sql
    - name: Run queries.sql
      env:
        PGPASSWORD: hello
      run: psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -f src/main/resources/queries.sql
    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven
    - name: Build with Maven
      run: mvn -B package --file pom.xml
